[project]
name = "data_platform"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "aiohttp>=3.11.0",
    "dagster==1.13.12",
    "dagster-dlt>=0.29.12",
    "dlt[filesystem,pyiceberg]>=1.28.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nselib>=2.5.1",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "pydantic-ai>=0.0.50",
    "pyiceberg[glue]>=0.11.1",
    "requests>=2.32.0",
    "runpod>=1.7.0",
    "selectolax>=0.3.27",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "data_platform"
registry_modules = [
    "data_platform.components.*",
]

[tool.uv]
# aiodns breaks async S3 DNS on Windows (pulled in via aiohttp speedups extra).
override-dependencies = ["aiodns==1.0.0; python_version < '0'"]

